<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
:root {
  --wine:#66364d;
  --gold:#d9b77a;
  --cream:#fff8ef;
  --pink:#f6e6e5;
  --text:#49343b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Georgia,'Times New Roman',serif;
  color:var(--text);
  background:#402c3a;
}
button,input,textarea{font:inherit}
#app{
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
}
.scene{
  position:relative;
  width:100%;
  max-width:650px;
  min-height:min(850px,96svh);
  border-radius:22px;
  overflow:hidden;
  background:var(--cream);
  box-shadow:0 12px 45px #160b1644;
  display:flex;
  flex-direction:column;
}
.scene-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  z-index:0;
}
.scene-bg:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,#fff8efaa,#fff8efdf 48%,#fff8efed);
}
.content{
  position:relative;
  z-index:1;
  flex:1;
  padding:24px 20px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.topline{
  font:12px Arial,sans-serif;
  letter-spacing:2px;
  text-transform:uppercase;
  color:#89616c;
  margin:0 0 12px;
}
h1{
  color:var(--wine);
  font-size:clamp(27px,7vw,39px);
  line-height:1.15;
  margin:5px 0 12px;
  font-weight:normal;
}
h2{
  color:var(--wine);
  font-size:24px;
  font-weight:normal;
  margin:8px 0 12px;
}
p{
  font-size:17px;
  line-height:1.55;
  margin:8px 0;
}
.small{font-size:14px;color:#876d70}
.story{
  width:100%;
  max-width:520px;
  background:#fffaf2e8;
  border:1px solid #ead8c8;
  border-radius:18px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 5px 20px #603b3010;
}
.girl{
  width:min(190px,55%);
  max-height:245px;
  object-fit:contain;
  margin:5px auto 0;
  filter:drop-shadow(0 6px 8px #49343b22);
}
.gift{
  width:min(190px,65%);
  max-height:190px;
  object-fit:contain;
  margin:12px auto;
}
.main-btn,.choice,.secondary-btn{
  border:0;
  border-radius:30px;
  padding:14px 20px;
  cursor:pointer;
  transition:.2s;
}
.main-btn{
  background:var(--wine);
  color:white;
  width:100%;
  max-width:420px;
  margin-top:16px;
  font-size:17px;
  box-shadow:0 5px 15px #66364d30;
}
.main-btn:active,.choice:active{transform:scale(.98)}
.secondary-btn{
  background:#f0e2d9;
  color:var(--wine);
  margin-top:10px;
}
.options{
  display:flex;
  flex-direction:column;
  gap:9px;
  width:100%;
  max-width:500px;
  margin:14px 0;
}
.choice{
  width:100%;
  text-align:left;
  color:var(--text);
  background:#fffaf5;
  border:1px solid #e7d4c8;
  font-size:16px;
  line-height:1.35;
}
.choice.selected{
  background:#ead8dc;
  border:2px solid #9a6577;
  color:#542b40;
}
.field{
  width:100%;
  max-width:500px;
  padding:14px;
  border-radius:13px;
  border:1px solid #d9c4b9;
  background:#fffdf9;
  color:var(--text);
  font-size:16px;
  margin:8px 0;
  outline-color:#9a6577;
}
textarea.field{min-height:90px;resize:vertical}
.progress{
  width:100%;
  height:5px;
  background:#eadbd4;
  border-radius:10px;
  margin:0 0 15px;
  overflow:hidden;
}
.progress span{
  display:block;
  height:100%;
  background:#b78a8a;
  transition:width .3s;
}
.footer{
  font:12px Arial,sans-serif;
  color:#9a7b7c;
  margin-top:auto;
  padding-top:16px;
}
.card-image{
  width:min(250px,75%);
  border-radius:15px;
  box-shadow:0 8px 25px #402c3a33;
  margin:12px auto;
}
.letter{
  text-align:left;
  line-height:1.8;
  white-space:pre-line;
  padding:20px;
  border:1px solid #e5d0bb;
  background:#fffaf0;
  border-radius:15px;
  width:100%;
  font-size:17px;
}
.wishes{
  text-align:left;
  width:100%;
  background:#fffaf2;
  border-radius:15px;
  padding:16px;
  line-height:1.7;
  margin:12px 0;
}
.wishes b{color:var(--wine)}
@media(max-width:480px){
  #app{padding:0}
  .scene{border-radius:0;min-height:100svh}
  .content{padding:20px 17px}
  p{font-size:16px}
}
@media print{
  body{background:white}
  #app{padding:0}
  .scene{box-shadow:none;border:0;max-width:none;min-height:0}
  .scene-bg,.girl,.main-btn,.secondary-btn,.footer,.progress{display:none!important}
  .content{padding:20px}
}
</style>
</head>

const state = {
 name:"",
 girlName:"Малышка",
 answers:{},
 chosenCard:null,
 selections:{},
 fields:{}
};
let index=0;
let cardOpened=false;

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function img(file,cls=""){
 return `<img class="${cls}" src="${esc(file)}" alt="" onerror="this.style.display='none'">`;
}
function save(){
 try{localStorage.setItem("novogodnee_chudo",JSON.stringify(state));}catch(e){}
}
function load(){
 try{
  const old=localStorage.getItem("novogodnee_chudo");
  if(old) Object.assign(state,JSON.parse(old));
 }catch(e){}
}
function answer(){return state.answers[index]||"";}
function fieldValue(){return state.fields[index]||"";}
function selections(){return state.selections[index]||[];}

function render(){
 const s=S[index];
 const pct=Math.round(index/(S.length-1)*100);
 let html=`
 <div class="scene">
 <div class="scene-bg" style="background-image:url('${A[s.bg]||A.cover}')"></div>
 <div class="content">
 <div class="topline">Маленькое новогоднее чудо</div>
 <div class="progress"><span style="width:${pct}%"></span></div>
 <div class="small">${s.ch===0?"": "Глава "+s.ch+" · "+["","Встреча","Тепло","Радость","Движение","Желания","Чудо"][s.ch]}</div>
 <h1>${esc(s.title)}</h1>
 <p>${esc(s.text)}</p>
 `;
 if(s.type!=="start" && s.type!=="name" && s.type!=="final"){
  html+=img(A.girl,"girl");
 }
 html+='<div class="story">';
 html+=renderBody(s);
 html+='</div>';
 if(s.note) html+=`<p class="small">${esc(s.note)}</p>`;
 html+=`<button class="main-btn" onclick="next()">${index===S.length-1?"Начать сказку заново":"Дальше"}</button>`;
 if(index>0) html+=`<button class="secondary-btn" onclick="back()">← Назад</button>`;
 html+=`<div class="footer">История, созданная с теплом · Диана Шакирова</div>`;
 html+='</div></div>';
 document.getElementById("app").innerHTML=html;
}

function renderBody(s){
 switch(s.type){
 case "start":
  return `${img(A.cover,"card-image")}
  <p>История о встрече с маленькой девочкой внутри себя, о заботе, радости, желаниях и волшебстве.</p>
  <p class="small">Устройся поудобнее. Это путешествие можно проходить в своём темпе.</p>`;
 case "name":
  return `<label>Как тебя зовут?</label><input class="field" id="nameInput" placeholder="Твоё имя" value="${esc(state.name)}">`;
 case "girlname":
  return `<label>Как ты хочешь назвать девочку?</label><input class="field" id="girlInput" placeholder="Имя девочки" value="${esc(state.girlName==="Малышка"?"":state.girlName)}"><p class="small">Можно оставить пустым — тогда она будет просто твоей маленькой девочкой.</p>`;
 case "text":
  return `<p>${esc(state.name)}, ${esc(s.note||"")}</p><p class="small">Не спеши. Побудь немного в этой истории.</p>`;
 case "multi":
 case "single":
  return `<div class="options">${s.options.map((o,i)=>{
   const selected=s.type==="multi"?selections().includes(o):answer()===o;
   return `<button class="choice ${selected?"selected":""}" onclick="pick(${i})">${selected?"✓ ":""}${esc(o)}</button>`;
  }).join("")}</div>
  ${s.field?`<textarea class="field" id="freeField" placeholder="${esc(s.field)}">${esc(fieldValue())}</textarea>`:""}
  <p class="small">${s.type==="multi"?"Можно выбрать несколько вариантов.":"Выбери то, что откликается."}</p>`;
 case "gift":
  return `${img(A[s.gift],"gift")}<h2>${esc(s.giftTitle)}</h2><p>Этот подарок остаётся с тобой как символ вашего путешествия.</p>`;
 case "dance":
  return `<p>Если хочется, включи любимую музыку и сделай несколько движений прямо сейчас.</p><p>Можно танцевать сидя, стоя или просто двигать руками. Всё по твоему желанию.</p><p class="small">Нажми «Дальше», когда будешь готова.</p>`;
 case "wishes":
  return `<div class="wishes">
  <p><b>Как я хочу себя чувствовать:</b><br>${esc(state.answers["wish1"]||"Пока прислушиваюсь к себе")}</p>
  <p><b>Что я хочу попробовать:</b><br>${esc(state.answers["wish2"]||"Пока прислушиваюсь к себе")}</p>
  <p><b>Что я хочу впустить в жизнь:</b><br>${esc(state.answers["wish3"]||"Пока прислушиваюсь к себе")}</p>
  </div>`;
 case "collection":
  return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
  ${["star","heart","butterfly","spark","snowflake"].map(k=>img(A[k],"gift")).join("")}
  </div><p>Звёздочка надежды · Сердечко тепла · Бабочка радости · Искорка жизни · Снежинка желаний</p>`;
 case "mac":
  if(!state.chosenCard){
   return `<p>Закрой глаза на мгновение. Выбери карту сердцем.</p><button class="main-btn" onclick="openCard()">Открыть мою карту ✨</button>`;
  }
  const c=macCards[state.chosenCard];
  return `${img(c.img,"card-image")}<h2>${esc(c.title)}</h2><p>${esc(c.message)}</p><p><b>Вопрос для тебя:</b><br>${esc(c.question)}</p><p><b>Маленькое действие:</b><br>${esc(c.action)}</p>`;
 case "letter":
  return `<div class="letter">${esc(makeLetter())}</div>`;
 case "finalwish":
  return `<label>Моё главное желание на новый год…</label><textarea class="field" id="finalWish" placeholder="Я хочу…">${esc(state.fields.finalWish||"")}</textarea>`;
 case "final":
  return `<div class="wishes">
  <h2>Твоё новогоднее чудо, ${esc(state.name||"дорогая")}!</h2>
  <p><b>Твои три желания</b></p>
  <p>1. ${esc(state.answers.wish1||"")}</p>
  <p>2. ${esc(state.answers.wish2||"")}</p>
  <p>3. ${esc(state.answers.wish3||"")}</p>
  <p><b>Твоё доброе обещание:</b><br>${esc(state.answers.promise||state.fields.promise||"")}</p>
  <p><b>Твоё главное желание:</b><br>${esc(state.fields.finalWish||"")}</p>
  ${state.chosenCard!==null?`<p><b>Твоя карта:</b> ${esc(macCards[state.chosenCard].title)}</p>${img(macCards[state.chosenCard].img,"card-image")}`:""}
  <p class="small">5 ноября 2026</p>
  </div>
  <p>Пусть в новом году у тебя будет больше тепла, свободы, радости и моментов, когда ты выбираешь себя.</p>
  <button class="secondary-btn" onclick="window.print()">Сохранить / распечатать</button>`;
 }
 return "";
}

function pick(i){
 const s=S[index],o=s.options[i];
 if(s.type==="multi"){
  let a=selections();
  a=a.includes(o)?a.filter(x=>x!==o):[...a,o];
  state.selections[index]=a;
 }else{
  state.answers[index]=o;
 }
 save();render();
}
function storeField(){
 const s=S[index];
 const el=document.getElementById("freeField");
 if(el) state.fields[index]=el.value;
 if(s.type==="name"){
  const n=document.getElementById("nameInput");
  if(n)state.name=n.value.trim();
 }
 if(s.type==="girlname"){
  const n=document.getElementById("girlInput");
  if(n)state.girlName=n.value.trim()||"Малышка";
 }
 if(s.type==="finalwish"){
  const n=document.getElementById("finalWish");
  if(n)state.fields.finalWish=n.value.trim();
 }
 if(s.saveAs){
  if(s.type==="multi")state.answers[s.saveAs]=(state.selections[index]||[]).join(", ");
  else state.answers[s.saveAs]=state.answers[index]||state.fields[index]||"";
 }
 save();
}
function next(){
 const s=S[index];
 storeField();
 if(s.type==="name"&&!state.name){
  alert("Напиши своё имя, чтобы сказка стала личной.");
  return;
 }
 if(s.type==="mac"&&!state.chosenCard){
  alert("Сначала открой свою карту.");
  return;
 }
 if(index<S.length-1){
  index++;
  render();
 }else{
  index=0;
  state.name="";
  state.girlName="Малышка";
  state.answers={};
  state.selections={};
  state.fields={};
  state.chosenCard=null;
  save();render();
 }
}
function back(){
 storeField();
 if(index>0){index--;render();}
}
function openCard(){
 state.chosenCard=Math.floor(Math.random()*macCards.length);
 save();render();
}
function makeLetter(){
 const wishes=[
  state.answers.wish1||"слышать себя",
  state.answers.wish2||"пробовать новое",
  state.answers.wish3||"впускать радость"
 ];
 const promise=state.answers.promise||state.fields.promise||"быть внимательнее к себе";
 return `Дорогая ${state.name||"моя хорошая"}!

Спасибо, что сегодня ты пришла ко мне. Я так рада, что мы познакомились!

Мне понравилось, как ты заботилась обо мне, играла, танцевала и слушала мои желания. Знаешь, я хочу, чтобы ты тоже помнила обо мне — о той маленькой девочке, которая живёт внутри тебя.

Тебе можно мечтать.
Тебе можно ошибаться.
Тебе можно отдыхать.
Тебе можно хотеть большего.
Тебе можно радоваться просто так.

Я запомнила твои желания:
${wishes[0]};
${wishes[1]};
${wishes[2]}.

И я услышала твоё доброе обещание: ${promise}.

Пожалуйста, не забывай о нас. Давай иногда играть, смеяться, мечтать и замечать маленькие чудеса.

Я верю, что впереди нас ждёт много хорошего.

С любовью,
твоя маленькая девочка ${state.girlName||""} ❤️`;
}

load();
render();
</script>
</body>
</html>
