
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#183c35">
<title>Маленькое новогоднее чудо</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,serif;color:#34483d}
body{background:#183c35}
button,input,textarea{font:inherit}
#app{min-height:100svh}
.scene{
 min-height:100svh;width:100%;padding:22px 15px;
 display:flex;align-items:center;justify-content:center;
 position:relative;background-size:cover;background-position:center;
 background-repeat:no-repeat;overflow:hidden
}
.scene:before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(12,35,29,.08),rgba(12,35,29,.25))
}
.cover{padding:0;align-items:flex-end}
.cover:before{background:linear-gradient(180deg,transparent 25%,rgba(10,25,20,.12) 50%,rgba(10,25,20,.72) 100%)}
.cover-content{position:relative;z-index:1;width:100%;text-align:center;padding:25px 18px max(40px,env(safe-area-inset-bottom));color:white}
.cover h1{font-size:clamp(36px,9vw,55px);line-height:1.05;margin:0 0 14px;color:#fff8e9;text-shadow:0 2px 15px #172d24;font-weight:normal}
.cover p{font-size:17px;line-height:1.5;margin:0 auto 24px;max-width:420px;text-shadow:0 2px 8px #172d24}
.panel{
 position:relative;z-index:1;width:min(100%,620px);
 max-height:calc(100svh - 36px);overflow-y:auto;
 -webkit-overflow-scrolling:touch;padding:clamp(22px,5vw,34px);
 border:1px solid rgba(255,255,255,.75);border-radius:25px;
 background:rgba(255,249,239,.94);
 box-shadow:0 18px 60px rgba(0,0,0,.25);text-align:center;
 backdrop-filter:blur(7px)
}
.chapter{color:#9a7841;text-transform:uppercase;letter-spacing:2px;font:12px Arial,sans-serif;margin-bottom:12px}
h2{color:#315747;font-size:clamp(25px,6vw,34px);line-height:1.2;margin:0 0 17px;font-weight:normal}
.story{font-size:18px;line-height:1.6;text-align:left;white-space:pre-line}
.primary{display:inline-block;padding:15px 27px;border-radius:30px;background:linear-gradient(135deg,#d9bd7d,#b58b4d);color:white;font: bold 16px Arial,sans-serif;box-shadow:0 5px 18px rgba(91,62,26,.22)}
.secondary{padding:12px 20px;border-radius:25px;color:#526b5b;background:#e9e3d5;font:14px Arial,sans-serif}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.field{width:100%;padding:15px 16px;border:1px solid #d8cbb2;border-radius:14px;background:rgba(255,255,255,.85);color:#34443b;font-size:17px;outline:none;margin-top:14px}
.field:focus{border-color:#b9965c}
textarea.field{min-height:105px;resize:vertical;line-height:1.5}
.options{display:grid;gap:10px;margin-top:20px}
.option{width:100%;padding:14px 16px;border:1px solid #dfd2bc;border-radius:15px;background:rgba(255,255,255,.78);color:#425649;text-align:left;font-size:16px;line-height:1.4}
.option.selected{border:2px solid #b28b50;background:#f6ecd8}
.progress-wrap{position:absolute;z-index:2;top:max(12px,env(safe-area-inset-top));left:18px;right:18px;height:4px;background:rgba(255,255,255,.4);border-radius:5px}
.progress{height:100%;border-radius:5px;background:#e6c77e;transition:width .3s}
.character{display:block;max-width:155px;max-height:175px;object-fit:contain;margin:0 auto 15px;filter:drop-shadow(0 7px 12px rgba(0,0,0,.12))}
.gift-canvas{display:block;width:min(65vw,230px);height:190px;object-fit:contain;margin:15px auto;filter:drop-shadow(0 0 20px rgba(232,194,106,.7))}
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.card-choice{padding:5px;border:2px solid transparent;border-radius:13px;background:#f0e6d4;overflow:hidden}
.card-choice.selected{border-color:#b28b50}
.card-choice img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;border-radius:8px}
.card-choice span{display:block;font:12px Arial,sans-serif;padding:6px 2px 3px;color:#526b5b}
.final-letter{padding:18px;background:rgba(255,255,255,.7);border-radius:16px;text-align:left;font-size:16px;line-height:1.65;white-space:pre-line;margin-top:18px}
.small-note{font-size:13px;color:#81745f;line-height:1.5;margin-top:12px}
@media(max-height:700px){.scene{padding:12px}.panel{max-height:calc(100svh - 24px);padding:19px}.story{font-size:16px;line-height:1.48}.character{max-height:115px}}
@media print{body{background:white}.scene{background:white!important;min-height:auto;padding:0}.scene:before,.progress-wrap,.actions{display:none!important}.panel{max-height:none;box-shadow:none;border:0;background:white}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById("app");
const bg={
 village:"village.JPG",cottage:"cottage.JPG",room:"room.JPG",
 shop:"toyshop.JPG",inside:"toyshop_inside.JPG",
 square:"christmas_square.JPG",tree:"wishing_tree.JPG"
};
const cards=[
 ["card_care.JPG","Забота"],
 ["card_choose_myself.JPG","Выбрать себя"],
 ["card_dance.JPG","Танец"],
 ["card_dream.JPG","Мечта"],
 ["card_inner_warmth.JPG","Внутреннее тепло"],
 ["card_my_wish.JPG","Моё желание"],
 ["card_new_path.JPG","Новый путь"],
 ["card_new_story.JPG","Новая история"],
 ["card_shine.JPG","Сияние"],
 ["card_small_joy.JPG","Маленькая радость"],
 ["card_time_for_me.JPG","Время для себя"],
 ["card_wonders.JPG","Чудеса"]
];
const steps=[
{bg:"village",chapter:"Глава 1. Начало сказки",title:"Городок, в котором живёт чудо",text:"Однажды, в преддверии Нового года, ты оказалась в маленьком заснеженном городке. В его окнах мерцали огоньки, с крыш свисали сосульки, а воздух пах хвоей и мандаринами.\n\nГоворили, что в этом городе каждый может встретить маленькое чудо. Но оно открывается тому, кто готов хотя бы ненадолго остановиться и прислушаться к себе.",button:"Продолжить путешествие"},
{bg:"cottage",chapter:"Глава 1. Начало сказки",title:"Домик на краю улицы",text:"На тихой улочке ты заметила уютный домик. В окне горел тёплый свет, а у двери лежала маленькая коробочка с запиской:\n\n«Здесь тебя ждёт та, которую ты, возможно, давно не навещала. Она всё ещё верит в чудеса и очень хочет с тобой поговорить».\n\nТы открываешь дверь…",button:"Войти в домик"},
{bg:"room",chapter:"Глава 1. Знакомство",title:"Встреча с маленькой девочкой",character:true,text:"В комнате у ёлки сидела маленькая девочка. Она подняла глаза и улыбнулась тебе. В этой девочке было что-то удивительно знакомое.\n\n«Я так долго тебя ждала. Как тебя зовут? А как зовут тебя сейчас, взрослую?»",type:"name",key:"girlName",placeholder:"Напиши своё имя"},
{bg:"room",chapter:"Глава 1. Знакомство",title:"О чём мечтает девочка?",text:"Девочка немного смутилась, а потом спросила:\n\n«А можно я расскажу тебе, чего мне иногда так не хватает?»\n\nВыбери то, что откликается тебе. Можно выбрать несколько вариантов.",type:"multi",key:"needs",options:["Чтобы меня обнимали и поддерживали","Чтобы меня слушали и слышали","Чтобы мне разрешали ошибаться","Чтобы у меня было время играть и радоваться","Чтобы меня хвалили и замечали","Чтобы я могла быть собой","Чтобы обо мне тоже заботились"]},
{bg:"room",chapter:"Глава 2. Самый тёплый подарок",title:"То, что хочется услышать",text:"«Знаешь, — тихо сказала девочка, — иногда мне так нужны добрые слова. Такие, от которых внутри становится спокойно и тепло».\n\nКакие слова ты хотела бы сказать ей сейчас?",type:"multi",key:"kindWords",options:["Я рядом. Ты не одна.","Ты хорошая просто потому, что ты есть.","Я вижу тебя и слышу.","Тебе не нужно быть идеальной.","Ты можешь ошибаться, и я всё равно тебя люблю.","Я горжусь тобой."]},
{bg:"room",chapter:"Глава 2. Самый тёплый подарок",title:"Твоё личное послание",text:"А теперь напиши ей несколько слов от себя. Не нужно подбирать красивые фразы. Пусть это будут именно твои слова.",type:"textarea",key:"message",placeholder:"Моя маленькая, я хочу сказать тебе..."},
{bg:"room",chapter:"Глава 2. Самый тёплый подарок",title:"Обещание себе",text:"Девочка взяла тебя за руку и спросила:\n\n«А ты будешь иногда вспоминать обо мне? Что ты могла бы пообещать мне — не из чувства долга, а от всего сердца?»",type:"choice",key:"promise",options:["Я буду чаще прислушиваться к себе.","Я буду разрешать себе отдыхать.","Я буду замечать свои маленькие радости.","Я буду относиться к себе бережнее.","Я буду поддерживать себя, даже если что-то не получится."]},
{bg:"room",chapter:"Глава 2. Самый тёплый подарок",title:"Сердечко тепла",text:"Девочка улыбнулась. В её ладонях появилось маленькое светящееся сердечко.\n\n«Это сердечко тепла. Пусть оно напоминает тебе: забота о себе — не награда за то, что ты всё успела. Ты достойна её уже сейчас».\n\nПрими этот подарок.",type:"gift",gift:"heart.JPG",giftName:"Сердечко тепла",button:"Принять подарок"},
{bg:"shop",chapter:"Глава 3. Лавка забытых радостей",title:"Лавка забытых радостей",text:"Попрощавшись с девочкой, ты отправилась дальше. На площади ты увидела маленькую лавку с необычной вывеской: «Здесь хранятся радости, о которых взрослые иногда забывают».\n\nВнутри было много коробочек, игрушек и удивительных мелочей. Хозяйка лавки предложила тебе выбрать то, что хочется вернуть в свою жизнь.",button:"Зайти в лавку"},
{bg:"inside",chapter:"Глава 3. Лавка забытых радостей",title:"Что хочется вернуть?",text:"Посмотри на список и выбери то, чему хочется снова дать место в своей жизни. Можно отметить несколько пунктов.",type:"multi",key:"joys",options:["Спонтанность и лёгкость","Творчество и создание чего-то своего","Игру и веселье","Время только для себя","Путешествия и новые впечатления","Тёплое общение","Умение мечтать и ждать хорошего","Удовольствие от простых вещей"]},
{bg:"inside",chapter:"Глава 3. Лавка забытых радостей",title:"Маленький шаг к радости",text:"А какую одну маленькую радость ты можешь вернуть себе уже в ближайшие дни? Не глобальное обещание, а что-то простое и настоящее.",type:"textarea",key:"smallJoy",placeholder:"В ближайшие дни я порадую себя..."},
{bg:"inside",chapter:"Глава 4. Волшебный подарок",title:"Звёздочка встречи",text:"Хозяйка лавки достала из бархатной шкатулки маленькую звёздочку.\n\n«Она напоминает о встрече с собой. Когда вокруг много дел и забот, посмотри на неё и вспомни: у тебя всегда есть возможность вернуться к себе — к своим желаниям, чувствам и мечтам».\n\nЭто твоя звёздочка встречи.",type:"gift",gift:"star.JPG",giftName:"Звёздочка встречи",button:"Забрать звёздочку"},
{bg:"square",chapter:"Глава 5. Площадь желаний",title:"Площадь новогодних огней",text:"Ты вышла на праздничную площадь. Повсюду звучала музыка, дети лепили снеговиков, а взрослые загадывали желания.\n\nВ центре площади стояло необычное дерево. Говорили, что оно умеет хранить самые искренние желания и помогает человеку не забывать о них.",button:"Подойти к дереву"},
{bg:"tree",chapter:"Глава 5. Дерево желаний",title:"Твоё желание",text:"Ты подошла к дереву и взяла в руки маленькую золотую ленточку.\n\nКакое желание тебе хочется доверить этому дереву? Не то, что от тебя ждут другие, а то, чего по-настоящему хочется именно тебе.",type:"textarea",key:"wish",placeholder:"В новом году я хочу..."},
{bg:"tree",chapter:"Глава 5. Дерево желаний",title:"Что поможет приблизиться к нему?",text:"Любое большое желание начинается с маленького шага. Какой первый шаг ты могла бы сделать навстречу своему желанию?",type:"textarea",key:"firstStep",placeholder:"Мой первый маленький шаг..."},
{bg:"square",chapter:"Глава 6. Твоя волшебная карта",title:"Выбери свою МАК-карту",text:"Перед тобой двенадцать волшебных карточек. Не пытайся угадать правильную. Просто выбери ту, которая сейчас притягивает взгляд.\n\nВозможно, именно в ней найдётся подсказка для тебя.",type:"cards",key:"macCard"},
{bg:"square",chapter:"Глава 6. Твоя волшебная карта",title:"О чём говорит твоя карта?",text:"Посмотри на выбранную карту. Какие чувства или мысли она вызывает? Что в ней откликается именно тебе?",type:"textarea",key:"macReflection",placeholder:"Когда я смотрю на эту карту, я чувствую..."},
{bg:"tree",chapter:"Финал",title:"Маленькое новогоднее чудо",text:"Ночь стала тихой. На дереве зажглись огоньки, а в небе появилась первая звезда.\n\nТы оглянулась и поняла: чудо не обязательно должно быть громким или невероятным. Иногда оно начинается с простого решения — услышать себя, заметить свои желания и отнестись к себе с теплом.\n\nТы забираешь с собой свои подарки, слова и маленькие обещания. И пусть в новом году у тебя будет больше места для себя настоящей.",button:"Прочитать моё письмо"}
];
let index=-1,selected=[];
let data={girlName:"",needs:[],kindWords:[],message:"",promise:"",joys:[],smallJoy:"",wish:"",firstStep:"",macCard:"",macReflection:""};
let promiseDraft="";
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cover(){
 app.innerHTML=`<section class="scene cover" style="background-image:url('cover.PNG')"><div class="cover-content"><h1>Маленькое<br>новогоднее чудо</h1><p>Сказочное путешествие к себе, своим желаниям и маленькой девочке внутри</p><button class="primary" onclick="start()">Начать путешествие</button></div></section>`;
}
function start(){index=0;selected=[];render()}
function render(){
 if(index<0){cover();return}
 const s=steps[index];
 let html=`<div class="chapter">${esc(s.chapter)}</div><h2>${esc(s.title)}</h2>`;
 if(s.character)html+=`<img class="character" src="girl.PNG" alt="Маленькая девочка">`;
 html+=`<div class="story">${esc(s.text).replace(/\n/g,"<br>")}</div>`;
 if(s.type==="name")html+=`<input class="field" id="answerField" maxlength="35" placeholder="${esc(s.placeholder)}" value="${esc(data[s.key])}">`;
 if(s.type==="textarea")html+=`<textarea class="field" id="answerField" placeholder="${esc(s.placeholder)}">${esc(data[s.key])}</textarea>`;
 if(s.type==="multi"||s.type==="choice"){
  html+=`<div class="options">`;
  s.options.forEach(o=>{let on=selected.includes(o);html+=`<button class="option ${on?"selected":""}" onclick="toggle('${esc(o)}')">${on?"✓ ":""}${esc(o)}</button>`});
  html+=`</div>`;
  if(s.type==="choice")html+=`<input class="field" id="otherField" placeholder="Или напиши своё обещание..." value="${esc(promiseDraft)}">`;
 }
 if(s.type==="gift")html+=`<canvas class="gift-canvas" id="giftCanvas"></canvas><div class="small-note">${esc(s.giftName)} теперь с тобой</div>`;
 if(s.type==="cards"){
  html+=`<div class="deck">`;
  cards.forEach(([src,label])=>{let on=data.macCard===src;html+=`<button class="card-choice ${on?"selected":""}" onclick="choose('${src}')"><img src="${src}" alt="${esc(label)}"><span>${on?"✓ ":""}${esc(label)}</span></button>`});
  html+=`</div>`;
 }
 html+=`<div class="actions"><button class="primary" onclick="next()">${esc(s.button||(s.type==="cards"?"Открыть подсказку":"Продолжить"))}</button></div>`;
 app.innerHTML=`<section class="scene" style="background-image:url('${bg[s.bg]}')"><div class="progress-wrap"><div class="progress" style="width="${Math.round((index+1)/steps.length*100)}%"></div></div><main class="panel">${html}</main></section>`;
 if(s.type==="gift")greenKey(s.gift);
}
function toggle(option){
 const s=steps[index];
 if(s.type==="choice"){
  const field=document.getElementById("otherField");
  promiseDraft=field?field.value:"";
  selected=selected.includes(option)?[]:[option];
 }else{
  selected=selected.includes(option)?selected.filter(x=>x!==option):[...selected,option];
 }
 render();
}
function choose(src){data.macCard=src;render()}
function next(){
 const s=steps[index];
 if(s.type==="name"){
  const v=document.getElementById("answerField").value.trim();
  if(!v){alert("Напиши, пожалуйста, своё имя.");return}
  data[s.key]=v;
 }
 if(s.type==="textarea"){
  data[s.key]=document.getElementById("answerField").value.trim();
 }
 if(s.type==="multi"){
  if(!selected.length){alert("Выбери хотя бы один вариант.");return}
  data[s.key]=[...selected];
 }
 if(s.type==="choice"){
  const field=document.getElementById("otherField");
  const own=field?field.value.trim():"";
  data.promise=own||selected[0]||"";
  if(!data.promise){alert("Выбери обещание или напиши своё.");return}
 }
 if(s.type==="cards"&&!data.macCard){alert("Выбери одну карточку.");return}
 if(index<steps.length-1){
  index++;
  const nextStep=steps[index];
  selected=nextStep.type==="multi"?(data[nextStep.key]||[]):nextStep.type==="choice"?(data.promise?[data.promise]:[]):[];
  promiseDraft="";
  render();
 }else renderFinal();
}
function greenKey(filename){
 const canvas=document.getElementById("giftCanvas");
 if(!canvas)return;
 const ctx=canvas.getContext("2d",{willReadFrequently:true});
 const img=new Image();
 img.onload=()=>{
  const scale=Math.min(1,500/img.width);
  canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  try{
   const im=ctx.getImageData(0,0,canvas.width,canvas.height),p=im.data,w=canvas.width,h=canvas.height;
   const seen=new Uint8Array(w*h),q=[];
   function green(i){let k=i*4,r=p[k],g=p[k+1],b=p[k+2];return g>65&&g>r*1.16&&g>b*1.12&&g-r>24}
   function add(x,y){if(x<0||y<0||x>=w||y>=h)return;let i=y*w+x;if(seen[i]||!green(i))return;seen[i]=1;q.push(i)}
   for(let x=0;x<w;x++){add(x,0);add(x,h-1)}
   for(let y=0;y<h;y++){add(0,y);add(w-1,y)}
   for(let n=0;n<q.length;n++){let i=q[n];p[i*4+3]=0;let x=i%w,y=(i/w)|0;add(x+1,y);add(x-1,y);add(x,y+1);add(x,y-1)}
   ctx.putImageData(im,0,0);
  }catch(e){console.log("Обработка фона недоступна",e)}
 };
 img.onerror=()=>console.log("Не найден файл:",filename);
 img.src=filename;
}
function renderFinal(){
 const name=data.girlName||"моя дорогая",c=cards.find(x=>x[0]===data.macCard);
 const date=new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
 const letter=`Дорогая ${name}!

Сегодня ты встретилась с маленькой девочкой внутри себя. Ты услышала её желания, сказала ей важные слова и подарила обещание заботиться о себе.

Тебе важно:
