
<!DOCTYPE html>
<html lang="ru">
<head>

<title>Маленькое новогоднее чудо</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=PT+Serif:wght@400;700&display=swap');

:root {
  --gold:#f5d28b;
  --cream:#fff8e9;
  --ink:#28364a;
}
* {box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  min-height:100svh;
  font-family:'PT Serif',serif;
  color:var(--cream);
  background:#142943;
}
button,input,textarea {font:inherit}
#app {
  min-height:100vh;
  min-height:100svh;
  position:relative;
  display:flex;
  flex-direction:column;
  background-size:cover;
  background-position:center;
  transition:background-image .5s ease;
  overflow:hidden;
}

}

}
.progress {

}

}

}
.panel {

  border-radius:22px;
  padding:22px 20px;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  overflow-y:auto;
}
h1,h2,h3,p {margin-top:0}
h1 {
  font-family:'Marck Script',cursive;
  font-size:clamp(40px,10vw,66px);
  line-height:1.05;
  font-weight:400;
  color:#ffe2a0;
  text-align:center;
  margin-bottom:12px;
  text-shadow:0 2px 15px rgba(0,0,0,.4);
}
h2 {
  font-family:'Marck Script',cursive;
  color:#ffe1a1;

  line-height:1.12;

  margin-bottom:16px;
}
h3 {
  color:#ffe1a1;
  font-size:18px;
  text-align:center;
}
p {

}
.story {

}
.small {

}
.center {text-align:center}
.gold {color:#ffe0a0}

}
.scene-image {
  display:block;
  width:min(75%,290px);

  margin:10px auto 16px;

button {

}
.choice {

  width:100%;
  margin:9px 0;
  background:rgba(255,248,233,.12);
  border:1px solid rgba(255,224,164,.65);
  color:#fff8e9;
  text-align:left;
  box-shadow:none;
  border-radius:14px;

}
.choice:active,.choice:hover {

}
input,textarea {
  display:block;

  margin:12px 0;

}

}
.footer {
  position:relative;
  z-index:2;
  text-align:center;
  padding:10px 8px 13px;
  color:#ffedcc;
  font-size:12px;
  text-shadow:0 1px 5px #142943;
}
.cover {
  background-image:linear-gradient(rgba(8,23,42,.1),rgba(8,23,42,.25)),url('village.JPG');
}
.cover main {max-width:600px;text-align:center}
.cover .panel {
  background:rgba(12,29,48,.43);
  border-color:rgba(255,224,164,.25);

}
.cover .girl {
  width:min(60%,260px);
  max-height:260px;
  margin:8px auto;
}
.cover-label {

  letter-spacing:1px;
  color:#fff0d0;
  text-align:center;
  margin-bottom:10px;
}
.subtitle {
  font-size:16px;
  line-height:1.55;
  text-align:center;
  color:#fff1d7;
}
.author {

  font-size:14px;
  line-height:1.6;
  color:#ffe4b0;
  margin-top:16px;
}
.gift-wrap {

  justify-content:center;
  align-items:center;
  min-height:160px;
}
.gift-wrap img {

  object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.3));
}
@media(max-height:700px) {
  main {padding-top:8px;padding-bottom:8px}
  .panel {padding:16px;max-height:67vh}

  .girl {max-height:170px}
  .cover .girl {max-height:190px}

</style>
</head>
<body>
<div id="app" class="cover">
  <div class="top">
    <span>❄ Маленькое новогоднее чудо</span>
    <span id="chapterTop"></span>
  </div>
  <div class="progress"><span id="progress" style="width:0%"></span></div>
  <main id="screen"></main>

</div>

<script>
const app = document.getElementById('app');
const screen = document.getElementById('screen');
const progress = document.getElementById('progress');
const chapterTop = document.getElementById('chapterTop');

const answers = {
  name:'',
  age:'',
  dream:'',
  care:'',
  joy:'',
  wish:'',
  step:'',
  card:''
};

const chapters = [
  {
    title:'Глава первая. Письмо из зимнего города',
    bg:'village.JPG',
    scenes:[
      {
        text:`В тот вечер снег шёл особенно тихо.

        Город уже готовился к Новому году. В окнах зажигались огоньки, на улицах пахло мандаринами, а прохожие торопились домой с пакетами подарков.

        И всё же в этой праздничной суете было что-то необычное.

        Когда ты подошла к своему окну, на подоконнике лежал маленький конверт. Ты точно помнила: ещё минуту назад его там не было.

        Бумага была тёплой, словно письмо только что держали в ладонях. На конверте золотыми буквами было написано: «Той, которая однажды перестала верить в маленькие чудеса».

        Ты открыла его.`
      },
      {
        text:`«Здравствуй.

        Мы давно тебя ждём.

        В одном заснеженном городе есть домик, в котором горит свет даже в самые тёмные вечера. Там живёт маленькая девочка. Она хранит твои забытые желания, радости и мечты.

        Она не сердится, что ты так долго не приходила. Но очень надеется, что в этот Новый год ты найдёшь дорогу к ней.

        Чтобы попасть в город, следуй за золотыми огоньками.

        И помни: тебе не нужно становиться кем-то другим. Достаточно ненадолго остановиться и услышать себя».

        Внизу письма была нарисована маленькая звезда. Стоило коснуться её пальцем, как за окном вспыхнула золотая искорка.`
      },
      {
        text:`Ты накинула тёплое пальто и вышла на улицу.

        Снег мягко поскрипывал под ногами. Впереди, между домами, один за другим загорались маленькие золотые огоньки. Они будто приглашали тебя идти дальше.

        Вскоре привычные улицы остались позади. Перед тобой открылся удивительный зимний городок: нарядные домики, украшенные еловыми ветками двери, фонари и дорожки, усыпанные искрящимся снегом.

        И где-то впереди, за поворотом, ты увидела тёплое окно.

        Может быть, именно там тебя и ждали?`
      },
      {
        text:`Ты остановилась перед небольшим домиком. На двери висел венок из еловых веток, а из трубы поднимался тонкий дымок.

        Внутри кто-то тихонько напевал.

        На пороге лежала ещё одна записка:

        «Прежде чем войти, вспомни: здесь не нужно быть удобной, сильной, правильной или взрослой. Здесь можно быть настоящей.

        Здесь тебе рады просто потому, что ты есть».

        Ты глубоко вдохнула и постучала.`
      }
    ]
  },
  {
    title:'Глава вторая. Та, которая тебя ждала',
    bg:'cottage.JPG',
    scenes:[
      {
        text:`Дверь медленно открылась.

        На пороге стояла маленькая девочка. На ней была уютная одежда, а в руках она держала плюшевого медвежонка.

        Девочка несколько секунд внимательно смотрела на тебя, будто пыталась убедиться, что это действительно ты.

        А потом улыбнулась:

        «Ты пришла! Я так долго тебя ждала… Я уже думала, что ты совсем забыла дорогу ко мне».

        В домике пахло какао, корицей и мандаринами. На столе стояли две чашки, а возле камина лежал мягкий плед.

        Девочка отступила в сторону и пригласила тебя войти.`
      },
      {
        text:`Вы устроились рядом у камина.

        Девочка поглаживала своего медвежонка и иногда поглядывала на тебя.

        «Знаешь, — сказала она, — иногда мне кажется, что взрослые так сильно торопятся жить, что забывают, как это — просто побыть маленькими.

        Они всё время куда-то спешат, что-то решают, о ком-то заботятся…

        А мне иногда хочется просто играть, мечтать, смеяться и знать, что обо мне тоже кто-нибудь позаботится».

        Она немного помолчала.

        «Можно я сегодня побуду с тобой?»`
      },
      {
        text:`Девочка протянула тебе маленький блокнот.

        «Я хочу, чтобы мы познакомились заново. Ведь ты так давно не спрашивала меня, какая я теперь».

        Представь, что ты можешь выбрать для неё имя. Не торопись. Пусть это будет имя, которое вызывает у тебя тепло или улыбку.`,
        input:'name',
        placeholder:'Как зовут твою внутреннюю девочку?'
      },
      {
        text:`Девочка уселась поудобнее и спросила:

        «А сколько мне сейчас лет? Мне хочется знать, какой ты меня видишь».

        Выбери возраст, который откликается тебе. Здесь нет правильного ответа.`,
        choices:[
          ['4 года','4 года'],
          ['5 лет','5 лет'],
          ['6 лет','6 лет'],
          ['7 лет','7 лет'],
          ['8 лет','8 лет']
        ],
        key:'age'
      },
      {
        text:`«А можно я расскажу тебе о своей мечте?» — спросила девочка.

        Она задумалась и посмотрела на огонь в камине.

        «Я мечтаю, чтобы у нас было больше времени на то, что радует. Чтобы можно было танцевать без повода, рисовать, гулять, смеяться и не думать, что это глупости.

        А ещё я хочу, чтобы ты иногда спрашивала меня, чего я хочу. Не только тогда, когда всё уже сделано. А просто так».

        А о чём мечтает твоя девочка? Что ей хочется почувствовать, попробовать или получить?`,
        input:'dream',
        placeholder:'Запиши её мечту…'
      },
      {
        text:`Ты смотришь на свою девочку и можешь выбрать, как сейчас проявить к ней заботу.

        Не нужно обещать невозможного. Достаточно маленького, настоящего жеста.

        Что тебе хочется сделать для неё прямо сейчас?`,
        choices:[
          ['Обнять её и побыть рядом','Обнять и побыть рядом'],
          ['Внимательно выслушать','Выслушать'],
          ['Поиграть и повеселиться','Поиграть вместе'],
          ['Сказать ей добрые слова','Сказать добрые слова'],
          ['Позволить ей помечтать','Дать ей помечтать']
        ],
        key:'care'
      },
      {
        text:`Девочка улыбнулась и прижала медвежонка к груди.

        «Мне так хорошо, когда ты не торопишь меня. Когда не говоришь, что я должна быть другой. Когда просто слушаешь.

        Знаешь, я не прошу тебя всё бросить и снова стать ребёнком. Я хочу, чтобы в твоей взрослой жизни осталось немного места для меня.

        Для радости. Для игры. Для желаний. Для маленьких чудес».

        Она протянула тебе маленький конверт.

        «Это тебе. Но открыть его можно будет чуть позже. Сначала нас ждёт одно очень интересное место…»`
      }
    ]
  },
  {
    title:'Глава третья. Лавка забытых радостей',
    bg:'toyshop.JPG',
    scenes:[
      {
        text:`Вы вышли из домика и направились по узкой улочке.

        Девочка шла рядом, иногда подпрыгивая на снегу. Вскоре вы заметили вывеску: «Лавка забытых радостей».

        За витриной переливались разноцветные огоньки. Там были воздушные шары, краски, музыкальные шкатулки, игрушки и множество удивительных мелочей.

        «Здесь хранятся радости, которые взрослые когда-то отложили на потом, — объяснила девочка. — Некоторые из них ждут уже очень давно».

        Дверь лавки тихонько звякнула колокольчиком.`
      },
      {
        text:`Внутри было тепло и уютно. На полках стояли коробочки с надписями: «Танцевать», «Рисовать», «Гулять без спешки», «Петь», «Смеяться», «Мечтать».

        Хозяин лавки улыбнулся:

        «Каждая радость здесь когда-то принадлежала кому-то. Но она не исчезла. Иногда достаточно снова разрешить себе её».

        Девочка посмотрела на тебя:

        «А какую радость ты давно откладываешь? Что тебе хотелось бы вернуть в свою жизнь?»`,
        input:'joy',
        placeholder:'Моя забытая радость…'
      },
      {
        text:`Ты назвала свою радость, и одна из коробочек на полке мягко засветилась.

        Хозяин бережно снял её и поставил перед тобой.

        «Забери её с собой. Но помни: радость не обязательно должна быть большой или дорогой. Иногда это пятнадцать минут наедине с собой, любимая музыка, прогулка или чашка чая в тишине.

        Важно не ждать особенного дня, чтобы позволить себе жить».

        Девочка взяла тебя за руку:

        «Давай пообещаем, что хотя бы одну маленькую радость мы вернём в нашу жизнь».`
      },
      {
        text:`Когда вы вышли из лавки, за вашей спиной зазвенел колокольчик.

        Девочка несла маленькую коробочку и выглядела очень довольной.

        «Знаешь, я думала, что мы будем искать что-то волшебное где-то далеко. А оказалось, что некоторые чудеса совсем рядом. Просто мы перестали их замечать».

        Впереди показалась площадь, над которой кружились золотые искорки.

        «Пойдём! Кажется, там для нас приготовили кое-что особенное».`
      }
    ]
  },
  {
    title:'Глава четвёртая. Подарок под звёздами',
    bg:'room.JPG',
    scenes:[
      {
        text:`На площади вас встретил хранитель зимних чудес.

        Он держал в руках небольшую коробочку, перевязанную золотой лентой.

        «Это подарок для той, кто сегодня нашла дорогу к себе, — сказал он. — Но его нельзя просто взять. Сначала нужно понять, что ты хочешь подарить себе в новом году».

        Девочка посмотрела на тебя:

        «Мне кажется, это очень важный вопрос. Ведь мы так часто ждём подарков от других, а сами забываем о себе».

        Хранитель поставил коробочку на маленький столик.

        «Когда будешь готова, открой её».`
      },
      {
        text:`Прежде чем открыть подарок, задержись на мгновение.

        Представь, что в новом году ты можешь подарить себе не вещь, а состояние.

        Больше спокойствия? Смелости? Свободы? Времени? Радости? Возможности выбирать себя?

        Не ищи красивый ответ. Прислушайся к тому, чего тебе действительно не хватает.

        Когда почувствуешь готовность, нажми на кнопку и открой подарок.`,
        action:'reveal'
      },
      {
        text:`Внутри коробочки лежала маленькая золотая звезда.`,
        image:'star.JPG',
        imageGift:true
      },
      {
        text:`Хранитель улыбнулся:

        «Эта звезда напоминает: ты не обязана ждать разрешения, чтобы заботиться о себе, мечтать и выбирать то, что делает твою жизнь ближе к желаемой.

        Пусть она станет символом твоего внутреннего света. Не того, который нужно кому-то доказывать, а того, который можно бережно хранить».

        Девочка осторожно коснулась звезды.

        «А можно загадать желание?» — спросила она.

        «Конечно. Но для начала давайте отправимся туда, где желания обретают направление».`
      }
    ]
  },
  {
    title:'Глава пятая. Дерево желаний',
    bg:'christmas_square.JPG',
    scenes:[
      {
        text:`Вы пришли на большую новогоднюю площадь.

        В самом центре стояла высокая ель. Её ветви были украшены маленькими фонариками, а под ними висели сотни записок с желаниями.

        Хранитель объяснил:

        «Это дерево не исполняет желания вместо человека. Оно помогает услышать то, что действительно важно, и найти первый шаг навстречу этому».

        Девочка достала из кармана маленькую золотую звёздочку.

        «Давай загадаем что-нибудь настоящее. Не то, что от нас ждут другие, а то, чего хочется именно нам».`
      },
      {
        text:`Представь, что наступает новый год, и у тебя появляется возможность сделать свою жизнь немного ближе к той, о которой ты мечтаешь.

        Что ты хочешь впустить в неё?

        Это может быть новое дело, отношения, отдых, путешествие, уверенность, деньги, свобода или что-то совсем своё.

        Запиши одно желание. Не ограничивай себя тем, что кажется возможным прямо сейчас.`,
        input:'wish',
        placeholder:'Моё желание на новый год…'
      },
      {
        text:`Ты повесила свою записку на ветку.

        Звёздочка в руках девочки вспыхнула мягким светом.

        «А знаешь, — сказала она, — мне нравится, что желание теперь не просто живёт в голове. Оно стало видимым. Его можно увидеть, вспомнить и однажды сделать для него что-то настоящее».

        Хранитель протянул тебе маленькую карточку:

        «У большого пути почти всегда есть первый небольшой шаг. Какой шаг ты можешь сделать сама, без ожидания идеального момента?»`,
        input:'step',
        placeholder:'Мой первый маленький шаг…'
      },
      {
        text:`Девочка внимательно прочитала твою записку.

        «Мне нравится твой шаг. Он не должен быть огромным. Главное, чтобы он был твоим.

        И если однажды ты забудешь о своём желании, вспомни этот вечер. Ты уже однажды остановилась, услышала себя и выбрала направление».

        Ветер слегка качнул ветви ели, и с неё упала маленькая снежинка.

        На площади зазвучала тихая музыка. Настало время последнего волшебства.`
      }
    ]
  },
  {
    title:'Глава шестая. Послание для тебя',
    bg:'wishing_tree.JPG',
    scenes:[
      {
        text:`На небольшой скамейке возле дерева лежала красивая колода карточек.

        «Здесь собраны послания, — объяснила девочка. — Каждая карточка напоминает о чём-то важном: заботе, смелости, радости, желаниях, новом пути.

        Не нужно выбирать самую красивую. Выбери ту, которая сейчас притягивает твой взгляд».

        Перед тобой появятся двенадцать карточек. Выбери одну интуитивно, не пытаясь угадать правильную.`
      },
      {type:'cards'},
      {
        text:`Ты выбрала свою карточку:`,
        type:'chosenCard'
      },
      {
        text:`Девочка подошла к тебе и крепко обняла.

        «Спасибо, что сегодня ты пришла ко мне. Я не хочу, чтобы ты вспоминала обо мне только в праздники.

        Давай иногда встречаться — в маленьких радостях, в мечтах, в музыке, в прогулках, в твоём отдыхе. Я буду рядом, когда ты позволишь себе услышать себя».

        За окном начинался тихий снегопад. Пора было возвращаться домой, но теперь ты знала: дорога к этому домику никуда не исчезнет.`
      },
      {
        text:`Перед уходом девочка вложила тебе в ладонь письмо.

        «Открой его, когда вернёшься домой».

        Внутри оказалось послание, написанное словно специально для тебя.

        Ты можешь сохранить его, перечитать в любой момент и возвращаться к своим желаниям столько раз, сколько захочешь.`
      },
      {type:'final'}
    ]
  }
];

const cardData = [
 ['card_care.JPG','Забота о себе'],
 ['card_choose_myself.JPG','Я выбираю себя'],
 ['card_dance.JPG','Разреши себе радость'],
 ['card_dream.JPG','Мечтай смелее'],
 ['card_inner_warmth.JPG','Внутреннее тепло'],
 ['card_my_wish.JPG','Моё желание'],
 ['card_new_path.JPG','Новый путь'],
 ['card_new_story.JPG','Новая история'],
 ['card_shine.JPG','Позволь себе сиять'],
 ['card_small_joy.JPG','Маленькие радости'],
 ['card_time_for_me.JPG','Время для себя'],
 ['card_wonders.JPG','Чудеса рядом']
];

let flatScenes = [];
let index = 0;
let giftRevealed = false;
let chosenCardIndex = -1;

chapters.forEach((chapter, ci) => {
  flatScenes.push({
    type:'chapter',
    title:chapter.title,
    bg:chapter.bg,
    chapter:ci+1
  });
  chapter.scenes.forEach(scene => {
    flatScenes.push({...scene,bg:chapter.bg,chapter:ci+1});
  });
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function setBackground(file) {
  app.style.backgroundImage =
    `linear-gradient(180deg,rgba(8,20,38,.12),rgba(8,20,38,.32)),url("${file}")`;
  app.classList.remove('cover');
}

function footerProgress() {
  progress.style.width = Math.round(index / flatScenes.length * 100) + '%';
}

function button(label,fn,cls='primary') {
  const b=document.createElement('button');
  b.className=cls;
  b.textContent=label;
  b.onclick=fn;
  return b;
}

function panel(title,body) {
  const box=document.createElement('section');
  box.className='panel';
  if(title) {
    const h=document.createElement('h2');
    h.textContent=title;
    box.appendChild(h);
  }
  box.appendChild(body);
  return box;
}

function paragraph(text) {
  const p=document.createElement('p');
  p.className='story';
  p.textContent=text;
  return p;
}

function next() {
  if(index < flatScenes.length-1) {
    index++;
    render();
  }
}

function addNext(box,label='Продолжить') {
  box.appendChild(button(label,next));
}

function saveInput(scene,box) {
  const field=document.createElement('textarea');
  field.placeholder=scene.placeholder || 'Напиши здесь…';
  field.value=answers[scene.input] || '';
  field.rows=2;
  box.appendChild(field);
  box.appendChild(button('Сохранить и продолжить',()=>{
    answers[scene.input]=field.value.trim();
    next();
  }));
}

function addChoices(scene,box) {
  scene.choices.forEach(([label,value])=>{
    box.appendChild(button(label,()=>{
      answers[scene.key]=value;
      next();
    },'choice'));
  });
}

function renderCover() {
  app.classList.add('cover');
  app.style.backgroundImage =
    `linear-gradient(180deg,rgba(8,20,38,.18),rgba(8,20,38,.3)),url("village.JPG")`;
  chapterTop.textContent='';
  progress.style.width='0%';
  screen.innerHTML='';

  const box=document.createElement('section');
  box.className='panel';

  const label=document.createElement('div');
  label.className='cover-label';
  label.textContent='Психологическая игра-сказка';
  box.appendChild(label);

  const title=document.createElement('h1');
  title.textContent='Маленькое новогоднее чудо';
  box.appendChild(title);

  const sub=document.createElement('div');
  sub.className='subtitle';
  sub.textContent='Путешествие к себе, своим желаниям и внутренней девочке';
  box.appendChild(sub);

  const girl=document.createElement('img');
  girl.src='girl.PNG';
  girl.className='girl';
  girl.alt='Маленькая девочка';
  box.appendChild(girl);

  const author=document.createElement('div');
  author.className='author';
  author.innerHTML='<strong>Диана Шакирова</strong><br>Психолог • Телесный терапевт';
  box.appendChild(author);

  box.appendChild(button('Начать путешествие ✨',()=>{
    index=0;
    render();
  }));
  screen.appendChild(box);
}

function renderChapter(scene) {
  const body=document.createElement('div');
  body.appendChild(paragraph(
    'Каждая новая глава — ещё один шаг в твоём маленьком путешествии. Не торопись. Здесь можно читать, чувствовать, вспоминать и выбирать то, что откликается именно тебе.'
  ));
  body.appendChild(button('Войти в эту главу ✨',next));
  screen.appendChild(panel(scene.title,body));
}

function renderCards(box) {
  const intro=document.createElement('p');
  intro.textContent='Посмотри на карточки и выбери ту, к которой сейчас тянется взгляд.';
  box.appendChild(intro);

  const grid=document.createElement('div');
  grid.className='card-grid';

  cardData.forEach((card,i)=>{
    const item=document.createElement('button');
    item.className='card-option';
    const img=document.createElement('img');
    img.src=card[0];
    img.alt=card[1];
    const name=document.createElement('span');
    name.textContent=card[1];
    item.append(img,name);
    item.onclick=()=>{
      answers.card=card[1];
      chosenCardIndex=i;
      next();
    };
    grid.appendChild(item);
  });
  box.appendChild(grid);
}

function renderChosenCard(box) {
  if(chosenCardIndex<0) chosenCardIndex=0;
  const card=cardData[chosenCardIndex];
  const img=document.createElement('img');
  img.src=card[0];
  img.className='scene-image';
  img.alt=card[1];
  box.appendChild(img);
  const title=document.createElement('h3');
  title.textContent=card[1];
  box.appendChild(title);
  box.appendChild(paragraph(
    'Побудь немного с этой карточкой. Что в ней откликается тебе? Какое чувство или мысль она пробуждает? Не нужно искать единственно верное толкование — самое важное сейчас то значение, которое ты сама ей придаёшь.'
  ));
  addNext(box,'Продолжить');
}

function renderFinal(box) {
  const name=answers.name || 'Моя дорогая девочка';
  const letter =
`Дорогая ${name}!

Сегодня мы встретились после долгой разлуки.

Я хочу, чтобы ты знала: я слышу тебя. Твои мечты, желания и маленькие радости важны для меня.

Я хочу чаще замечать то, что делает нас счастливыми, не откладывать жизнь на потом и находить время для себя.

Я помню твою мечту: ${answers.dream || 'мечтать и радоваться жизни'}.

Я хочу проявлять к тебе заботу: ${answers.care || 'быть рядом и слышать тебя'}.

Я не обещаю, что всё изменится за один день. Но я могу начать с маленького шага: ${answers.step || 'сделать что-то хорошее для себя'}.

И я хочу помнить о желании: ${answers.wish || 'которое сегодня родилось в моём сердце'}.

С теплом,
Ты сама ❤️`;

  const h=document.createElement('h3');
  h.textContent='Твоё письмо себе';
  box.appendChild(h);
  const p=document.createElement('p');
  p.style.whiteSpace='pre-line';
  p.textContent=letter;
  box.appendChild(p);

  const copy=button('Скопировать письмо',()=>{
    if(navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(letter)
        .then(()=>{copy.textContent='Письмо скопировано ❤️';})
        .catch(()=>fallbackCopy(letter,copy));
    } else fallbackCopy(letter,copy);
  });
  box.appendChild(copy);

  box.appendChild(button('Завершить путешествие ✨',()=>{
    screen.innerHTML='';
    const done=document.createElement('section');
    done.className='panel center';
    const h2=document.createElement('h2');
    h2.textContent='Твоё чудо уже началось';
    done.appendChild(h2);
    done.appendChild(paragraph(
      'Пусть в твоей жизни будет больше места для желаний, нежности, радости и заботы о себе. И пусть дорога к маленькой девочке внутри тебя всегда остаётся открытой.'
    ));
    done.appendChild(button('Пройти сказку ещё раз',()=>{
      Object.keys(answers).forEach(k=>answers[k]='');
      chosenCardIndex=-1;
      index=0;
      render();
    }));
    screen.appendChild(done);
  }));
}

function fallbackCopy(text,btn) {
  const area=document.createElement('textarea');
  area.value=text;
  document.body.appendChild(area);
  area.select();
  try {
    document.execCommand('copy');
    btn.textContent='Письмо скопировано ❤️';
  } catch(e) {
    btn.textContent='Выдели текст письма и скопируй';
  }
  area.remove();
}

/* Удаление зелёного фона по краям изображения.
   Обрабатываются только зелёные области, соединённые с краями. */
function removeGreenBackground(img) {
  if(img.dataset.cleaned==='yes') return;
  img.dataset.cleaned='yes';

  const process=()=>{
    try {
      const w=img.naturalWidth, h=img.naturalHeight;
      if(!w || !h) return;
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0);
      const image=ctx.getImageData(0,0,w,h);
      const d=image.data;
      const total=w*h;
      const seen=new Uint8Array(total);
      const queue=new Int32Array(total);
      let head=0,tail=0;

      function green(i) {
        const p=i*4, r=d[p],g=d[p+1],b=d[p+2];
        return g>65 && g>r*1.16 && g>b*1.12 && g-r>18;
      }
      function add(i) {
        if(i<0 || i>=total || seen[i] || !green(i)) return;
        seen[i]=1;
        queue[tail++]=i;
      }
      for(let x=0;x<w;x++) {add(x);add((h-1)*w+x);}
      for(let y=0;y<h;y++) {add(y*w);add(y*w+w-1);}

      while(head<tail) {
        const i=queue[head++];
        d[i*4+3]=0;
        const x=i%w;
        if(x>0) add(i-1);
        if(x<w-1) add(i+1);
        if(i>=w) add(i-w);
        if(i<total-w) add(i+w);
      }

      /* Убираем зелёный оттенок на прилегающих пикселях */
      for(let i=0;i<total;i++) {
        if(seen[i]) continue;
        const p=i*4, r=d[p],g=d[p+1],b=d[p+2];
        if(g>r*1.08 && g>b*1.08 && g-r>8) {
          let near=false;
          const x=i%w;
          if(x>0 && seen[i-1]) near=true;
          if(x<w-1 && seen[i+1]) near=true;
          if(i>=w && seen[i-w]) near=true;
          if(i<total-w && seen[i+w]) near=true;
          if(near) d[p+1]=Math.min(g,r+(g-r)*.35);
        }
      }
      ctx.putImageData(image,0,0);
      img.src=canvas.toDataURL('image/png');
    } catch(e) {
      console.log('Не удалось обработать фон подарка',e);
    }
  };
  if(img.complete) process();
  else img.addEventListener('load',process,{once:true});
}

function render() {
  if(index>=flatScenes.length) index=flatScenes.length-1;
  const scene=flatScenes[index];
  setBackground(scene.bg);
  chapterTop.textContent='Глава '+scene.chapter+' из 6';
  footerProgress();
  screen.innerHTML='';

  if(scene.type==='chapter') {
    renderChapter(scene);
    return;
  }

  const body=document.createElement('div');
  body.appendChild(paragraph(scene.text || ''));

  if(scene.image) {
    const wrap=document.createElement('div');
    wrap.className='gift-wrap';
    const img=document.createElement('img');
    img.src=scene.image;
    img.alt='Волшебный подарок';
    wrap.appendChild(img);
    body.appendChild(wrap);
    if(scene.imageGift) {
      img.addEventListener('load',()=>removeGreenBackground(img),{once:true});
    }
  }

  const box=panel('',body);

  if(scene.type==='cards') {
    renderCards(box);
  } else if(scene.type==='chosenCard') {
    renderChosenCard(box);
  } else if(scene.type==='final') {
    renderFinal(box);
  } else if(scene.input) {
    saveInput(scene,box);
  } else if(scene.choices) {
    addChoices(scene,box);
  } else if(scene.action==='reveal') {
    box.appendChild(button('Открыть подарок ✨',()=>{
      giftRevealed=true;
      next();
    }));
  } else {
    addNext(box);
  }

  screen.appendChild(box);
}

renderCover();
</script>
