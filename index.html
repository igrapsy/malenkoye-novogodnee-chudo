
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#17243a">
<title>Маленькое новогоднее чудо</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap');

:root {
  --gold: #e8c98d;
  --cream: #fff8ed;
  --ink: #263044;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  font-family: 'Montserrat', sans-serif;
  color: var(--cream);
  background: #17243a;
}

body { overflow-x: hidden; }

#app {
  min-height: 100svh;
  position: relative;
  display: flex;
  flex-direction: column;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  isolation: isolate;
  transition: background-image .5s ease;
}

#app::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    180deg,
    rgba(12, 23, 43, .12),
    rgba(12, 23, 43, .35)
  );
  pointer-events: none;
}

.top-space {
  flex: 1 0 12px;
  min-height: 14px;
}

.main {
  width: min(92%, 680px);
  margin: 0 auto;
  padding: 20px 0 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.panel {
  width: 100%;
  padding: 22px 20px;
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 22px;
  background: rgba(17, 29, 48, .70);
  box-shadow: 0 12px 40px rgba(0,0,0,.18);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

.cover-panel {
  background: rgba(17, 29, 48, .40);
  text-align: center;
  padding: 24px 18px;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: 2.4px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
  line-height: 1.6;
}

h1, h2, h3, .story-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  line-height: 1.08;
  margin: 0;
  text-align: center;
}

h1 {
  font-size: clamp(42px, 11vw, 68px);
  color: #fff5e6;
  text-shadow: 0 3px 20px rgba(0,0,0,.25);
}

h2 {
  font-size: clamp(34px, 8vw, 48px);
  color: #fff3df;
  margin-bottom: 15px;
}

h3 {
  font-size: 29px;
  color: #f8dfb6;
  margin-bottom: 10px;
}

.subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-size: 25px;
  color: #f3dfc0;
  text-align: center;
  margin: 14px 0 20px;
}

p {
  font-size: 14px;
  line-height: 1.75;
  margin: 0 0 13px;
  color: #fff8ee;
}

p:last-child { margin-bottom: 0; }

.story {
  font-size: 14px;
  line-height: 1.8;
}

.story p { margin-bottom: 14px; }

.gold {
  color: #f2d49e;
  font-weight: 600;
}

.center { text-align: center; }

.small-note {
  font-size: 12px;
  line-height: 1.65;
  color: #eadcc8;
  text-align: center;
  margin-top: 12px;
}

.chapter-label {
  text-align: center;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.chapter-number {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  text-align: center;
  color: #e9c995;
  margin-bottom: 8px;
}

button, .choice {
  font-family: 'Montserrat', sans-serif;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.primary-btn {
  display: block;
  width: 100%;
  max-width: 360px;
  margin: 20px auto 0;
  padding: 15px 20px;
  border: 1px solid rgba(255,255,255,.45);
  border-radius: 40px;
  background: linear-gradient(135deg, #ead2a8, #c99d68);
  color: #302b2b;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .3px;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
}

.primary-btn:active { transform: scale(.98); }

.secondary-btn {
  display: block;
  width: 100%;
  max-width: 340px;
  margin: 12px auto 0;
  padding: 13px 18px;
  border: 1px solid rgba(236,211,171,.7);
  border-radius: 35px;
  color: #f8e7ca;
  background: rgba(255,255,255,.08);
  font-size: 12px;
  font-weight: 600;
}

input, textarea, select {
  display: block;
  width: 100%;
  margin: 8px 0 15px;
  padding: 13px 14px;
  border: 1px solid rgba(237,213,180,.55);
  border-radius: 12px;
  outline: none;
  background: rgba(255,250,241,.96);
  color: #303343;
  font: 14px 'Montserrat', sans-serif;
}

textarea { min-height: 78px; resize: vertical; }

label {
  display: block;
  color: #f4dfbd;
  font-size: 12px;
  line-height: 1.5;
  margin-top: 12px;
}

.choice-list {
  display: grid;
  gap: 9px;
  margin: 12px 0;
}

.choice {
  text-align: left;
  padding: 13px 14px;
  width: 100%;
  border: 1px solid rgba(238,214,180,.45);
  border-radius: 13px;
  color: #fff5e8;
  background: rgba(255,255,255,.09);
  font-size: 12px;
  line-height: 1.5;
}

.choice.selected {
  background: rgba(224,190,135,.28);
  border-color: #efd19d;
  box-shadow: inset 0 0 0 1px rgba(239,209,157,.3);
}

.scene-art {
  display: block;
  max-width: 100%;
  max-height: 230px;
  width: auto;
  height: auto;
  object-fit: contain;
  margin: 12px auto 18px;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,.22));
}

.gift-art {
  width: min(70%, 230px);
  height: 190px;
  object-fit: contain;
  display: block;
  margin: 10px auto 16px;
}

.gift-canvas {
  display: block;
  width: min(75%, 240px);
  max-height: 220px;
  object-fit: contain;
  margin: 10px auto 16px;
  filter: drop-shadow(0 8px 20px rgba(0,0,0,.25));
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 11px;
  margin: 18px auto 8px;
  max-width: 420px;
}

.mac-card {
  aspect-ratio: 3 / 4.2;
  border: 1px solid rgba(240,213,166,.8);
  border-radius: 12px;
  background:
    radial-gradient(circle at 50% 35%, rgba(226,197,147,.24), transparent 35%),
    repeating-linear-gradient(45deg, transparent 0 8px, rgba(255,255,255,.035) 8px 9px),
    linear-gradient(145deg, #344967, #18243c 65%, #4b3852);
  box-shadow: 0 5px 14px rgba(0,0,0,.25);
  color: #f4d9a9;
  position: relative;
  overflow: hidden;
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mac-card::before {
  content: "✦";
  position: absolute;
  font-size: 27px;
  opacity: .8;
}

.mac-card::after {
  content: "✧  ✧";
  position: absolute;
  bottom: 13px;
  font-size: 12px;
  letter-spacing: 9px;
  opacity: .65;
}

.mac-card span {
  position: relative;
  z-index: 1;
  font-family: 'Cormorant Garamond', serif;
  font-size: 23px;
  opacity: .9;
}

.mac-card:active { transform: scale(.97); }

.revealed-card {
  width: min(75%, 250px);
  margin: 15px auto;
  padding: 10px;
  border-radius: 15px;
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(240,213,166,.55);
  animation: appear .7s ease both;
}

.revealed-card img {
  width: 100%;
  display: block;
  border-radius: 9px;
}

.revealed-card-title {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 25px;
  color: #f4d6a6;
  margin: 12px 0 3px;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(12px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.final-letter {
  padding: 20px 18px;
  border: 1px solid rgba(238,211,169,.5);
  border-radius: 15px;
  background: rgba(255,248,235,.10);
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px;
  line-height: 1.55;
  color: #fff4e4;
  white-space: pre-line;
}

.footer {
  width: 100%;
  padding: 12px 10px 15px;
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 17px;
  color: #f0d7ad;
  text-shadow: 0 2px 8px rgba(0,0,0,.6);
}

.bottom-space {
  flex: 1 0 8px;
  min-height: 8px;
}

@media (max-height: 700px) {
  .main { padding-top: 10px; padding-bottom: 8px; }
  .panel { padding: 17px 16px; }
  .scene-art { max-height: 150px; }
  .gift-canvas { max-height: 150px; }
  .footer { padding-top: 7px; padding-bottom: 9px; }
}

@media (max-width: 380px) {
  .panel { padding: 18px 15px; }
  p, .story { font-size: 13px; }
  .card-grid { gap: 8px; }
}
</style>
</head>

<body>
<div id="app">
  <div class="top-space"></div>
  <main class="main" id="main"></main>
  <div class="bottom-space"></div>
  <footer class="footer">Создано с теплом Дианой Шакировой</footer>
</div>

<script>
const app = document.getElementById('app');
const main = document.getElementById('main');

const state = {
  step: 'cover',
  girlName: '',
  girlAge: '6',
  dream: '',
  care: 'Обнять её и дать почувствовать, что она не одна',
  joy: '',
  wish: '',
  firstStep: '',
  chosenCard: null,
  giftOpened: false
};

const cards = [
  { file: 'card_care.JPG', title: 'Забота о себе', text: 'Тебе не нужно заслуживать заботу. Она нужна тебе не только тогда, когда ты устала или всё сделала. Ты можешь выбирать себя в обычные дни — без объяснений и чувства вины.' },
  { file: 'card_choose_myself.JPG', title: 'Выбрать себя', text: 'Возможно, пришло время чаще спрашивать себя: «А чего хочу я?» Твой выбор имеет значение. И ты можешь учитывать свои желания, не обесценивая чувства других.' },
  { file: 'card_dance.JPG', title: 'Разрешить себе движение', text: 'Не всё в жизни нужно контролировать и продумывать. Иногда достаточно позволить себе двигаться, пробовать, ошибаться и снова чувствовать радость.' },
  { file: 'card_dream.JPG', title: 'Мечта', text: 'Не уменьшай свою мечту только потому, что пока не знаешь дороги к ней. Позволь ей быть. Путь может открываться постепенно, шаг за шагом.' },
  { file: 'card_inner_warmth.JPG', title: 'Внутреннее тепло', text: 'В тебе есть место, где можно отдохнуть от требований и ожиданий. Возвращайся к этому ощущению через простые вещи: тепло, тишину, дыхание и бережность к себе.' },
  { file: 'card_my_wish.JPG', title: 'Моё желание', text: 'Твоё желание не становится менее важным оттого, что кому-то оно кажется странным или слишком большим. Прислушайся к нему. Возможно, именно с этого начинается перемена.' },
  { file: 'card_new_path.JPG', title: 'Новый путь', text: 'Тебе не обязательно видеть весь маршрут. Иногда достаточно заметить ближайшую дверь и решиться сделать один небольшой шаг.' },
  { file: 'card_new_story.JPG', title: 'Новая история', text: 'Прошлое объясняет многое, но не обязано определять всё будущее. Ты можешь постепенно создавать другую историю — такую, в которой есть место тебе.' },
  { file: 'card_shine.JPG', title: 'Позволить себе сиять', text: 'Не прячь свои способности, желания и красоту жизни. Тебе не нужно становиться меньше, чтобы другим было удобно. Твоё место в этом мире есть.' },
  { file: 'card_small_joy.JPG', title: 'Маленькая радость', text: 'Не откладывай жизнь до большого события. Иногда возвращение к себе начинается с маленькой радости, которую ты разрешила себе сегодня.' },
  { file: 'card_time_for_me.JPG', title: 'Время для себя', text: 'Твоё время — не остаток после всех дел. Ты тоже часть своей жизни. Найди для себя хотя бы немного пространства, в котором не нужно никому ничего доказывать.' },
  { file: 'card_wonders.JPG', title: 'Место для чудес', text: 'Не всё прекрасное можно заранее рассчитать. Оставь в своей жизни немного места для неожиданного, нового и доброго. Иногда чудо начинается с разрешения ему случиться.' }
];

const gifts = {
  heart: {
    file: 'heart.JPG',
    title: 'Сердце заботы',
    text: 'Это маленькое сердце напоминает тебе: любовь начинается не только с того, что ты отдаёшь другим. Она начинается и с того, как ты относишься к себе. Сегодня можно быть к себе немного нежнее.'
  },
  star: {
    file: 'star.JPG',
    title: 'Звезда надежды',
    text: 'Звезда не показывает весь путь. Она просто помогает не потерять направление. Даже если сейчас ты видишь только один маленький шаг, этого достаточно, чтобы начать движение.'
  },
  spark: {
    file: 'spark.JPG',
    title: 'Искорка внутри',
    text: 'Внутри тебя есть искра — интерес, желание, энергия, которая иногда становится почти незаметной под повседневными делами. Не требуй от себя большого огня. Позволь искре разгореться постепенно.'
  },
  snowflake: {
    file: 'snowflake.JPG',
    title: 'Снежинка уникальности',
    text: 'Нет двух одинаковых снежинок. И тебе не нужно быть похожей на кого-то, чтобы быть ценной. Твоя особенность — не то, что нужно исправить. Это часть тебя.'
  },
  butterfly: {
    file: 'butterfly.JPG',
    title: 'Бабочка перемен',
    text: 'Перемены не всегда происходят громко. Иногда сначала меняется взгляд на себя, потом появляется новое решение, а уже после — новые действия. Дай себе время раскрыться.'
  }
};

function escapeHTML(value) {
  return String(value || '').replace(/[&<>"']/g, function(char) {
    return ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;',
      '"': '&quot;', "'": '&#39;'
    })[char];
  });
}

function setBackground(file) {
  app.style.backgroundImage = "url('" + file + "')";
}

function button(label, action, secondary = false) {
  return `<button class="${secondary ? 'secondary-btn' : 'primary-btn'}" data-action="${action}">${label}</button>`;
}

function panel(content, extraClass = '') {
  main.innerHTML = `<section class="panel ${extraClass}">${content}</section>`;
}

function page(bg, content, extraClass = '') {
  setBackground(bg);
  panel(content, extraClass);
  window.scrollTo(0, 0);
}

function chapterPage(number, title, teaser, bg, nextStep) {
  page(bg, `
    <div class="chapter-label">Маленькое новогоднее чудо</div>
    <div class="chapter-number">Глава ${number}</div>
    <h2>${title}</h2>
    <div class="story center">${teaser}</div>
    ${button('Продолжить путешествие', nextStep)}
  `);
}

function cover() {
  setBackground('village.JPG');
  panel(`
    <div class="eyebrow">Психологическая игра-сказка</div>
    <img class="scene-art" src="girl.PNG" alt="Девочка">
    <h1>Маленькое<br>новогоднее чудо</h1>
    <div class="subtitle">Сказочное путешествие к себе</div>
    <p class="center">Иногда самое настоящее чудо — снова услышать себя, вспомнить свои желания и позволить себе немного волшебства.</p>
    <p class="center gold" style="margin-top:18px">Диана Шакирова</p>
    <p class="center" style="font-size:11px">Психолог • Телесный терапевт</p>
    ${button('Начать сказку', 'intro')}
  `, 'cover-panel');
  window.scrollTo(0, 0);
}

function intro() {
  page('village.JPG', `
    <div class="eyebrow">Одним зимним вечером…</div>
    <h2>Письмо, которое ждало тебя</h2>
    <div class="story">
      <p>В тот вечер снег падал особенно тихо. Город уже зажёг огни, в окнах мерцали гирлянды, а воздух пах приближающимся праздником.</p>
      <p>Ты шла по своим привычным делам, когда заметила на снегу маленький конверт. Он был перевязан золотой нитью. На конверте аккуратным почерком было написано:</p>
      <p class="center gold">«Той, которая однажды перестала замечать маленькие чудеса».</p>
      <p>Ты остановилась. Почему-то стало понятно: письмо адресовано именно тебе.</p>
      <p>Внутри лежала записка:</p>
      <p class="gold">«Я знаю, что ты многое успеваешь, о многом заботишься и часто откладываешь себя на потом. Но где-то в одном маленьком зимнем домике тебя очень ждут. Там живёт девочка, которая помнит твои мечты. Она хранит кое-что важное для тебя.</p>
      <p class="gold">Если захочешь встретиться с ней, иди за золотыми огоньками. Сегодня можно никуда не торопиться».</p>
      <p>Вдалеке действительно загорелась крошечная золотая искорка. Потом ещё одна. И ещё… Они складывались в дорожку, ведущую к старому зимнему городу.</p>
      <p>Ты можешь сделать первый шаг. А можешь пока просто побыть здесь и почувствовать, хочется ли тебе этого путешествия.</p>
    </div>
    ${button('Я хочу отправиться в путь', 'chapter1')}
  `);
}

function chapter1() {
  chapterPage(
    '1',
    'Дорога огоньков',
    `<p>Золотые огоньки ведут тебя всё дальше. За поворотом открывается маленький городок: заснеженные крыши, светящиеся окна и улица, по которой будто никто не ходил много лет.</p>
     <p>В конце улицы стоит домик с тёплым светом в окне. На двери висит маленький колокольчик. Кажется, внутри тебя уже ждут…</p>`,
    'village.JPG',
    'journey'
  );
}

function journey() {
  page('cottage.JPG', `
    <div class="eyebrow">Ты почти у цели</div>
    <h2>Домик с тёплым окном</h2>
    <div class="story">
      <p>Ты подходишь к домику. На крыльце лежит пушистый снег, а из трубы поднимается тонкая струйка дыма.</p>
      <p>Когда ты касаешься колокольчика, дверь тихонько открывается. Изнутри доносится запах корицы, мандаринов и горячего какао.</p>
      <p>На пороге появляется маленькая девочка. Она прижимает к себе плюшевого мишку и смотрит на тебя так, словно узнала сразу.</p>
      <p class="gold">«Ты всё-таки пришла… Я так долго тебя ждала».</p>
    </div>
    ${button('Войти в дом', 'chapter2')}
  `);
}

function chapter2() {
  chapterPage(
    '2',
    'Та, которая тебя помнит',
    `<p>За дверью — уютная комната, мягкий плед и чашки с какао. Девочка смотрит на тебя с любопытством. Она помнит то, о чём взрослая ты могла давно забыть: свои мечты, любимые игры и желание быть услышанной.</p>
     <p>Сегодня у вас будет время поговорить. Не нужно отвечать правильно. Здесь можно быть настоящей.</p>`,
    'room.JPG',
    'meetGirl'
  );
}

function meetGirl() {
  page('room.JPG', `
    <div class="eyebrow">Встреча с собой</div>
    <h2>«Я так тебя ждала…»</h2>
    <img class="scene-art" src="girl.PNG" alt="Девочка">
    <div class="story">

function processGiftImage(filename, canvas) {
  const img = new Image();
  img.onload = function() {
    const maxWidth = 700;
    const scale = Math.min(1, maxWidth / img.naturalWidth);
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    canvas.width = w;
    canvas.height = h;

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, w, h);

    let imageData;
    try {
      imageData = ctx.getImageData(0, 0, w, h);
    } catch (error) {
      return;
    }

    const pixels = imageData.data;
    const total = w * h;
    const transparent = new Uint8Array(total);
    const queue = new Int32Array(total);
    let head = 0;
    let tail = 0;

    function isGreen(index) {
      const p = index * 4;
      const r = pixels[p];
      const g = pixels[p + 1];
      const b = pixels[p + 2];
      return g > 65 && g > r * 1.22 && g > b * 1.12;
    }

    function add(index) {
      if (index < 0 || index >= total || transparent[index] || !isGreen(index)) return;
      transparent[index] = 1;
      queue[tail++] = index;
    }

    for (let x = 0; x < w; x++) {
      add(x);
      add((h - 1) * w + x);
    }
    for (let y = 0; y < h; y++) {
      add(y * w);
      add(y * w + w - 1);
    }

    while (head < tail) {
      const i = queue[head++];
      const x = i % w;
      const y = Math.floor(i / w);
      if (x > 0) add(i - 1);
      if (x < w - 1) add(i + 1);
      if (y > 0) add(i - w);
      if (y < h - 1) add(i + w);
    }

    for (let i = 0; i < total; i++) {
      const p = i * 4;
      if (transparent[i]) {
        pixels[p + 3] = 0;
      } else {
        const r = pixels[p];
        const g = pixels[p + 1];
        const b = pixels[p + 2];
        if (g > r * 1.12 && g > b * 1.08) {
          pixels[p + 1] = Math.max(r, b, Math.round(g * .78));
        }
      }
    }

    ctx.putImageData(imageData, 0, 0);
  };
  img.onerror = function() {
    const area = document.getElementById('giftArea');
    if (area) area.innerHTML = `<img class="gift-art" src="${filename}" alt="Волшебный подарок">`;
  };
  img.src = filename;
}

document.addEventListener('click', function(event) {
  const careButton = event.target.closest('[data-care]');
  if (careButton) {
    state.care = careButton.dataset.care;
    document.querySelectorAll('[data-care]').forEach(el => {
      el.classList.toggle('selected', el === careButton);
    });
    return;
  }

  const cardButton = event.target.closest('[data-card]');
  if (cardButton) {
    revealCard(Number(cardButton.dataset.card));
    return;
  }

  const actionButton = event.target.closest('[data-action]');
  if (!actionButton) return;

  const action = actionButton.dataset.action;

  if (action === 'openGift') {
    revealGift(actionButton.dataset.gift, actionButton.dataset.next);
    return;
  }

  if (actions[action]) actions[action]();
});

function accessMessage(title, message) {
  setBackground('village.JPG');
  panel(`

    <h2>${title}</h2>
    <p class="center">${message}</p>

}

function startApp() {
  const tg = window.Telegram && window.Telegram.WebApp;

  if (!tg) {
    accessMessage('Открой сказку в Telegram', 'Запусти сказку через бота.');
    return;
  }

  tg.ready();
  tg.expand();
  cover();
}

const telegramScript = document.createElement('script');
telegramScript.src = 'https://telegram.org/js/telegram-web-app.js';
telegramScript.onload = startApp;
document.head.appendChild(telegramScript);
